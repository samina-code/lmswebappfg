<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Password Reset Complete</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: #fff;
      padding: 25px 30px;
      border-radius: 12px;
      box-shadow: 0px 6px 15px rgba(0,0,0,0.15);
      text-align: center;
      max-width: 420px;
    }
    h2 {
      color: #001f4d;
      margin-bottom: 15px;
    }
    p {
      color: #333;
      margin-bottom: 20px;
    }
    a {
      display: inline-block;
      background: #001f4d;
      color: #fff;
      text-decoration: none;
      padding: 10px 22px;
      border-radius: 8px;
      transition: background 0.3s;
    }
    a:hover {
      background: #003366;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Password Successfully Changed</h2>
    <p>Your password has been updated. You can now log in with your new password.</p>
    <a href="{% url 'SignIn' %}">Go to Login</a>
  </div>
</body>
</html>
