
{% load static %}

{% block content %}
<div class="container" style="
      background: #fff;
      padding: 25px 30px;
      border-radius: 12px;
      box-shadow: 0px 6px 15px rgba(0,0,0,0.15);
      text-align: center;
      max-width: 420px;
      margin: 50px auto;
    ">
  <h2 style="color: #001f4d; margin-bottom: 15px;">Password Reset Email Sent</h2>
  <p style="color: #333; margin-bottom: 20px; line-height: 1.5;">
    If your email address is registered, you will receive a password reset link shortly.
  </p>
  <a href="/" style="
      display: inline-block;
      background: #001f4d;
      color: #fff;
      text-decoration: none;
      padding: 10px 22px;
      border-radius: 8px;
      transition: background 0.3s;
    ">
    Return Home
  </a>
</div>
{% endblock %}
